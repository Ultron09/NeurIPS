name: 🛡️ Antara V26.0 Surgical Gauntlet

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  run-full-spec:
    name: 🧪 ANTARA_FULL Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Research Repo
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 📦 Install Latest Antara & Deps
      run: |
        python -m pip install --upgrade pip
        # Install the latest official release from PyPI
        pip install airborne-antara --upgrade
        
        # Install local research requirements
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        # Verify
        python -c "import airborne_antara; print(f'✅ Antara {airborne_antara.__version__} Ready')"

    - name: 🔬 Execute ANTARA_FULL Spec (CI Optimized)
      run: |
        # Use full Spec logic but scale for CI timeout safety
        python Phase_IV_Ablation/benchmark_runner.py \
          --method "ANTARA_FULL" \
          --epochs 5 \
          --tasks 10 \
          --suffix "CI_RUN"

    - name: 📊 Plot & Export Metrics
      if: always()
      run: |
        # Attempt plot generation
        if [ -d results ]; then
          python Phase_III_Metrics/generate_plots.py --input results/ANTARA_FULL_CI_RUN_metrics.json || echo "Plotting skipped"
        fi

    - name: 🤖 Antara Sentinel Audit
      if: always()
      run: |
        # Run the Sentinel Agent to judge the performance
        if [ -f results/ANTARA_FULL_CI_RUN_metrics.json ]; then
          python Phase_IV_Ablation/sentinel_agent.py --results results/ANTARA_FULL_CI_RUN_metrics.json --target 60.0
          # Post report to GitHub Summary
          cat sentinel_report.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Antara-Titan-Results
        path: |
          results/
          plots/
          *.log
